# Site estático (Astro -> dist/). Worker "assets-only": sem script `main`, o
# Cloudflare serve os arquivos direto. Publica pelo Workers Builds ligado ao
# repositório (build `npm run build`, deploy `npx wrangler deploy`) — o build
# roda autenticado na infra do Cloudflare, sem token em lugar nenhum.
name = "alvarogalhardo"
compatibility_date = "2026-09-07"

[assets]
directory = "./dist"
# rota sem arquivo -> o 404.html mais proximo subindo a arvore, com status 404.
# scripts/postbuild.mjs emite dist/pt/404.html pra rota /pt/* inexistente cair no
# 404 em portugues. (o Workers rejeita status 404 em _redirects, entao nao ha
# _redirects; ver .docs/architecture.md.)
not_found_handling = "404-page"
